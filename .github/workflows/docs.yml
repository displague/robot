# The docs site: mkdocs build (docs/index.md regenerated from the docs' front matter) and, on main, a GitHub Pages
# deploy once Pages is set to "GitHub Actions" in the settings and the repository variable PAGES_ENABLED is "true".
name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "tools/docs_index.py", "tools/mkdocs_hooks.py", "requirements-docs.txt", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "tools/docs_index.py", "tools/mkdocs_hooks.py", "requirements-docs.txt"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: python tools/docs_index.py --check
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
